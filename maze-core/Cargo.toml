[package]
name = "maze-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9"
rand_xoshiro = "0.7"
bitflags = "2"
maze-core-macros = { path = "../maze-core-macros" }

[features]
# Finite dev-only tessellation exercising the full Tessellation contract (GitHub issue #765).
test-tessellation = []

[dev-dependencies]
trybuild = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[[example]]
name = "print_maze"

[[test]]
name = "generation"
path = "tests/generation/mod.rs"
