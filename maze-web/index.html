<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #1a1a1a; color: #e0e0e0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #boot-splash { height:100%; display:flex; align-items:center; justify-content:center; background:#1a1a1a; }
      .boot-content { width:280px; display:flex; flex-direction:column; align-items:center; text-align:center; }
      .boot-mark { width:48px; height:48px; display:grid; place-items:center; border:1px solid #3a6ea8; border-radius:8px; color:#3a6ea8; font-size:24px; font-weight:700; margin-bottom:10px; }
      .boot-name { font-size:20px; font-weight:600; margin-bottom:26px; }
      #boot-status { min-height:17px; margin-bottom:9px; color:#aaa; font-size:14px; }
      .boot-track { width:100%; height:4px; overflow:hidden; border-radius:2px; background:#2d2d2d; }
      #boot-progress-bar { width:100%; height:100%; border-radius:inherit; background:#3a6ea8; transform:scaleX(.3); transform-origin:left; transition:transform 120ms linear; }
      #boot-progress-value { height:14px; margin-top:6px; color:#888; font-size:12px; }
      .loading-progress-indeterminate { animation: loading-progress-slide 3s ease-in-out infinite; }
      @keyframes loading-progress-slide { from { transform:translateX(-30%) scaleX(.3); } to { transform:translateX(100%) scaleX(.3); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash"><div class="boot-content"><div class="boot-mark" aria-hidden="true">M</div><div class="boot-name">Maze Studio</div><div id="boot-status" role="status">Loading…</div><div id="boot-progress-track" class="boot-track" role="progressbar" aria-label="Loading"><div id="boot-progress-bar" class="loading-progress-indeterminate"></div></div><div id="boot-progress-value"></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
