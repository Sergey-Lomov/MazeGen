[package]
name = "maze-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
test-tessellation = ["maze-core/test-tessellation", "maze-runner/test-tessellation"]

[dependencies]
maze-core = { path = "../maze-core" }
maze-core-macros = { path = "../maze-core-macros" }
maze-runner = { path = "../maze-runner" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = "0.9"

[dev-dependencies]
serde_json = "1"
